[project]
name = "jobflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=5.9,<6", "prometheus-client>=0.22,<1"
]
[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
ignore = ["B008", "BLE001", "C408", "DTZ003", "DTZ005"]
